services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fleet}
      POSTGRES_DB: fleet
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet -d fleet"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: .
    env_file: .env
    environment: &backend
      DATABASE_URL: postgresql+asyncpg://fleet:${POSTGRES_PASSWORD:-fleet}@db:5432/fleet
      REDIS_URL: redis://redis:6379/0
    ports: ["127.0.0.1:8000:8000"]
    command: ["sh", "-c", "alembic upgrade head && python -m simulator.seed && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-access-log"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 30
  worker:
    build: .
    env_file: .env
    environment: *backend
    command: ["python", "-m", "workers.position_consumer"]
    depends_on:
      api: {condition: service_healthy}
  simulator:
    build: .
    env_file: .env
    environment: *backend
    command: ["python", "-m", "simulator.run", "--url", "http://api:8000", "--trigger-alerts"]
    profiles: ["demo"]
    depends_on:
      api: {condition: service_healthy}
      worker: {condition: service_started}
volumes:
  pgdata:
  redisdata:
