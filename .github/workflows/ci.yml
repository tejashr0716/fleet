name: Fleet CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: fleet, POSTGRES_PASSWORD: fleet, POSTGRES_DB: fleet_test}
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U fleet -d fleet_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://fleet:fleet@localhost:5432/fleet_test
      REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip}
      - run: pip install -e '.[dev]'
      - run: ruff check . && ruff format --check .
      - run: alembic upgrade head
      - run: pytest -q
      - name: JavaScript syntax checks
        run: for f in static/*.js; do node --check "$f"; done
