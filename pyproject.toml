[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fleet"
version = "1.0.0"
description = "Real-Time Telemetry Platform (FastAPI, Redis Streams, TimescaleDB, H3)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "redis[hiredis]>=5.0.4",
    "h3>=4.1.0",
    "orjson>=3.10.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "ruff>=0.4.4",
    "numpy>=1.26.0",
]

[tool.setuptools.packages.find]
include = ["app*", "workers*", "simulator*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "RET", "C4", "ASYNC"]
ignore = ["ANN401", "UP046", "ASYNC230", "ASYNC240"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
