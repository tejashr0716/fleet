[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "fleet"
version = "2.0.0"
description = "Interview-ready vehicle tracking with FastAPI, PostgreSQL and Redis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
 "fastapi==0.115.8", "uvicorn[standard]==0.34.0", "pydantic-settings==2.8.1",
 "sqlalchemy[asyncio]==2.0.38", "asyncpg==0.30.0", "alembic==1.14.1",
 "redis[hiredis]==5.2.1", "PyJWT==2.10.1", "pwdlib[argon2]==0.2.1",
 "httpx==0.28.1", "websockets==14.2"
]
[project.optional-dependencies]
dev = ["pytest==8.3.5", "pytest-asyncio==0.25.3", "ruff==0.9.10"]
[tool.setuptools.packages.find]
include = ["app*", "workers*", "simulator*", "benchmark*"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
